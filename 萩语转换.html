var FF={zh:'"Noto Sans SC",sans-serif',en:'Anton,Impact,sans-serif',ja:'"Noto Sans JP",sans-serif',di:'"Times New Roman",serif'};
function menu(){
 $('menu').innerHTML=LG.map(function(g){return '<div class="it'+(g[0]==L?' a':'')+'" data-l="'+g[0]+'"><div class="fl">'+FL[g[0]]+'</div><span class="lb" style="font-family:'+FF[g[0]]+'">'+g[1]+'</span></div>'}).join('');
}
$('bg').onclick=function(){var m=$('menu');menu();m.classList.toggle('on')};
$('menu').onclick=function(e){var t=e.target.closest('.it');if(!t)return;L=t.getAttribute('data-l');$('menu').classList.remove('on');render()};
$('dirb').onclick=flip;
$('in').oninput=run;
$('out').onclick=function(e){var c=e.target.closest('.c');if(!c||!items)return;var x=items[+c.getAttribute('data-k')];if(x.c.length>1){x.i=(x.i+1)%x.c.length;showOut()}};
function fallbackCopy(text){
 var ta=document.createElement('textarea');
 ta.value=text;
 ta.setAttribute('readonly','');
 ta.style.position='fixed';
 ta.style.left='-9999px';
 ta.style.top='0';
 ta.style.opacity='0';
 document.body.appendChild(ta);
 ta.focus();
 ta.select();
 ta.setSelectionRange(0,ta.value.length);
 var ok=false;
 try{ok=document.execCommand('copy')}catch(e){ok=false}
 document.body.removeChild(ta);
 return ok;
}
$('cp').onclick=async function(){
 var b=$('cpt'),ok=false;
 try{
  if(navigator.clipboard&&navigator.clipboard.writeText){
   await navigator.clipboard.writeText(OUT);
   ok=true;
  }
 }catch(e){ok=false}
 if(!ok)ok=fallbackCopy(OUT);
 b.textContent=ok?S('done'):S('fail');
 setTimeout(function(){b.textContent=S('copy')},1200);
};

render();
